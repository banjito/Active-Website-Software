<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent browser caching of this HTML file to ensure users always get latest version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/ampOS-favicon.svg?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>ampOS</title>
    <script>
      // FORCE CLEANUP - Kill old service workers and caches automatically
      // This runs BEFORE any cached JavaScript can interfere
      (function() {
        var CLEANUP_KEY = 'amp_cleanup_v4'; // Increment this to force re-cleanup
        var RELOAD_KEY = 'amp_reloading';
        
        // Prevent reload loops
        if (sessionStorage.getItem(RELOAD_KEY) === 'true') {
          sessionStorage.removeItem(RELOAD_KEY);
          return;
        }
        
        // Check if we've already done cleanup
        if (localStorage.getItem(CLEANUP_KEY) === 'done') {
          return; // Already cleaned, skip
        }
        
        // Do the cleanup
        var needsReload = false;
        
        // 1. Kill all service workers
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations.length > 0) {
              needsReload = true;
              registrations.forEach(function(reg) {
                reg.unregister();
              });
            }
          });
        }
        
        // 2. Clear all caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            if (names.length > 0) {
              needsReload = true;
              names.forEach(function(name) {
                caches.delete(name);
              });
            }
          });
        }
        
        // 3. Clear potentially corrupted localStorage data
        try {
          var keysToRemove = [];
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && (
              key.indexOf('opportunityFilters') !== -1 ||
              key.indexOf('customerList') !== -1 ||
              key.indexOf('contactList') !== -1 ||
              key.indexOf('amp_') !== -1
            )) {
              keysToRemove.push(key);
            }
          }
          if (keysToRemove.length > 0) {
            needsReload = true;
            keysToRemove.forEach(function(k) {
              localStorage.removeItem(k);
            });
          }
        } catch(e) {}
        
        // 4. Mark cleanup as done
        try {
          localStorage.setItem(CLEANUP_KEY, 'done');
        } catch(e) {}
        
        // 4. If we cleaned something, reload after a short delay
        setTimeout(function() {
          if (needsReload) {
            sessionStorage.setItem(RELOAD_KEY, 'true');
            window.location.reload(true);
          }
        }, 500);
      })();
    </script>
    <script>
      // iPhone/iPad zoom in when you tap a text box with small text. Capping
      // the zoom level stops that jump; iOS still allows pinch zoom.
      // Desktop browsers ignore this tag.
      (function () {
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPad|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!isIOS) return;
        var viewport = document.querySelector('meta[name="viewport"]');
        if (viewport) {
          viewport.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
