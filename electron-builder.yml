# electron-builder config for ampOS Offline.
# Release with scripts/release-offline.mjs.
appId: com.ampreports.offlinereports
productName: ampOS Offline
copyright: Copyright © Amp Reports

directories:
  output: release
  buildResources: build-resources

# Where installed apps look for new versions (latest.yml / latest-mac.yml). Same
# address as the portal's download buttons. The repo must stay public, or move
# this feed, because the app reads it without logging in.
publish:
  provider: generic
  url: https://github.com/banjito/Active-Website-Software/releases/latest/download

# What ships inside the asar. The compiled Electron processes plus the built
# renderer (emitted by `npm run electron:build`). The renderer is fully bundled
# by Vite, so the only runtime node_modules needed are the native better-sqlite3
# (with its `bindings`/`file-uri-to-path` helpers) and electron-updater (with
# everything it requires). The release script fails if the updater can't load.
# Everything else in this webapp's package.json (puppeteer, react-pdf, …) is
# excluded to keep the app small — otherwise electron-builder drags in the
# entire web dependency tree.
files:
  - electron/build/**/*
  - electron/renderer-dist/**/*
  - "!node_modules/**/*"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
  - "node_modules/electron-updater/**/*"
  - "node_modules/builder-util-runtime/**/*"
  - "node_modules/debug/**/*"
  - "node_modules/ms/**/*"
  - "node_modules/sax/**/*"
  - "node_modules/fs-extra/**/*"
  - "node_modules/graceful-fs/**/*"
  - "node_modules/jsonfile/**/*"
  - "node_modules/universalify/**/*"
  - "node_modules/js-yaml/**/*"
  - "node_modules/argparse/**/*"
  - "node_modules/lazy-val/**/*"
  - "node_modules/lodash.escaperegexp/**/*"
  - "node_modules/lodash.isequal/**/*"
  - "node_modules/semver/**/*"
  - "node_modules/tiny-typed-emitter/**/*"

extraResources:
  - from: build-resources/icon.png
    to: build-resources/icon.png
  - from: build-resources/icon-dark.png
    to: build-resources/icon-dark.png
  - from: build-resources/icon.ico
    to: build-resources/icon.ico

# better-sqlite3 (added in Phase 1) is a native module and must stay unpacked.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

win:
  # Hand-built .ico (BMP frames for 16-128px, PNG for 256px). Without it,
  # electron-builder converts icon.png into an all-PNG-frame .ico, which some
  # Windows shell surfaces (taskbar, shortcuts) render as a blank icon.
  icon: build-resources/icon.ico
  target:
    - nsis
    - msi
  # The portal's download button and the updater both use this file, so the
  # name is fixed. No spaces: GitHub rewrites them and updates would 404.
  artifactName: ampOS-Offline-Windows-x64-Setup.${ext}

mac:
  category: public.app-category.business
  # The updater picks the Apple Silicon file by finding "arm64" in its name, so
  # the portal's fixed-name zip is a separate copy (see release-offline.mjs).
  artifactName: ampOS-Offline-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # Developer ID = Apple's cert for apps shipped outside the App Store (GitHub
  # Releases). Pinned so a build without it fails loudly instead of shipping an
  # unsigned app that macOS reports as "damaged". Notarization runs when
  # APPLE_KEYCHAIN_PROFILE is set (see `xcrun notarytool store-credentials`).
  identity: "AMP LLC (DJQD5689XT)"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
